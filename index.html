<!doctype html>
<html>
  <head>
    <title><%= productName %></title>
    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <!-- Link preview for WhatsApp, Messenger, Instagram, Slack, X and others. Crawlers need absolute
         URLs, so these point at the GitHub Pages site. public/og-image.jpg is 1200x630. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="<%= productName %>">
    <meta property="og:title" content="<%= productName %>">
    <meta property="og:description" content="See where your money goes, and where you could find some. A prototype for the PostFinance challenge, in six languages.">
    <meta property="og:url" content="https://hacking-cats.github.io/beyond_the_list/">
    <meta property="og:image" content="https://hacking-cats.github.io/beyond_the_list/og-image.jpg">
    <meta property="og:image:secure_url" content="https://hacking-cats.github.io/beyond_the_list/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Beyond the List on a phone: spending bubbles and savings ideas">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="<%= productName %>">
    <meta name="twitter:description" content="See where your money goes, and where you could find some.">
    <meta name="twitter:image" content="https://hacking-cats.github.io/beyond_the_list/og-image.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>">
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
