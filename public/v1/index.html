<html lang="en">
<head>
<meta charset="UTF-8">

<title>Klar – Household Money Explainer (prototype)</title>

<style>
/* Beyond the List: design tokens for the single-file app. Same values as tokens/*.json. */
:root {
  --yellow: #FFCC00;  --yellow-dark: #E6B800;   /* primary button background only */
  --petrol: #005C66;  --petrol-dark: #00474F;   /* links, secondary buttons, chips, marker */
  --grapefruit: #FF5A36;                         /* action border and icon only, never text */
  --light-blue: #7FD1E8;                         /* decorative only */

  --surface: #FFFFFF; --surface-subtle: #F5F7F8; --surface-inverse: #0E1A1C;
  --tint-attention: #FFF6DB; --tint-action: #FFEDE8; --tint-info: #E8F6FB;

  --text: #10201F; --text-secondary: #4A5A5C; --text-muted: #616F70;
  --text-inverse: #FFFFFF; --text-disabled: #8A9798;
  --border: #D8DEDF; --border-strong: #616F70;

  --success-text: #1B7F4B; --warning-text: #946219; --error-text: #C0392B;
  --info-text: #266BC7; --urgent-text: #BC4227;

  --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-title: 22px; --fs-subtitle: 18px; --fs-body: 16px; --fs-small: 14px;
  --fs-caption: 12px; --fs-wit: 15px; --fs-display: 32px;

  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-xxl: 32px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;
  --shadow-sheet: 0 -4px 24px rgba(0, 0, 0, 0.12);

  --t-fast: 120ms; --t-normal: 200ms; --t-slow: 300ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --touch: 44px; --content-max: 480px;
}
.amount { font-variant-numeric: tabular-nums; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Beyond the List: component classes. Requires tokens.css.
   Markup for every component: see preview.html. */

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--font); font-size: var(--fs-body); line-height: 1.5;
  color: var(--text); background: var(--surface-subtle); -webkit-font-smoothing: antialiased;
}
.app { max-width: var(--content-max); margin: 0 auto; min-height: 100vh; background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom); }
:focus-visible { outline: 2px solid var(--petrol); outline-offset: 2px; }
.icon { width: 24px; height: 24px; flex: none; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon--sm { width: 20px; height: 20px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Header ------------------------------------------------------------- */
.app-header { position: sticky; top: 0; z-index: 10; background: var(--surface);
  border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--sp-xs) var(--sp-sm);
  padding: calc(var(--sp-md) + env(safe-area-inset-top)) var(--sp-lg) var(--sp-md); }
.app-header__title { flex: 1; margin: 0; font-size: var(--fs-title); font-weight: 600; }
.app-header__date { order: 3; width: 100%; display: flex; align-items: center;
  justify-content: space-between; gap: var(--sp-sm); white-space: nowrap; font-size: var(--fs-small); color: var(--text-secondary); }
.chip-proto { font-size: var(--fs-caption); font-weight: 600; color: var(--text-secondary);
  background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--r-pill);
  padding: 2px 10px; }

/* ---- Statement line -------------------------------------------------------- */
.statement { list-style: none; margin: 0; padding: 0; }
.day { margin: 0; padding: var(--sp-xl) var(--sp-lg) var(--sp-sm); font-size: var(--fs-caption);
  font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.line { display: flex; align-items: center; gap: var(--sp-md); width: 100%; min-height: 56px;
  padding: var(--sp-sm) var(--sp-lg); background: none; border: 0; border-bottom: 1px solid var(--border);
  font: inherit; color: inherit; text-align: left; cursor: pointer; }
.line:active { background: var(--surface-subtle); }
.line__main { flex: 1; min-width: 0; }
.line__merchant, .line__original { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.line__original { font-size: var(--fs-caption); color: var(--text-muted); }
.line__flag { display: inline-flex; color: var(--petrol); }
.line__flag--attention { color: var(--warning-text); }
.line__flag--action { color: var(--grapefruit); }
.line__amount { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.line__amount--in { color: var(--success-text); }

/* ---- Answer sheet ---------------------------------------------------------- */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(14, 26, 28, 0.45);
  opacity: 0; pointer-events: none; transition: opacity var(--t-normal) var(--ease); }
.backdrop.is-open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0 auto;
  max-width: var(--content-max); max-height: 85vh; overflow-y: auto; background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-sheet);
  padding: var(--sp-sm) var(--sp-lg) calc(var(--sp-xl) + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform var(--t-normal) var(--ease); }
.sheet.is-open { transform: none; }
.sheet__handle { width: 36px; height: 4px; margin: 0 auto var(--sp-sm); border-radius: var(--r-pill);
  background: var(--border); }
.sheet__close { position: absolute; top: var(--sp-sm); right: var(--sp-sm); width: var(--touch);
  height: var(--touch); display: grid; place-items: center; border: 0; border-radius: var(--r-pill);
  background: none; color: var(--text-secondary); cursor: pointer; }
.sheet__head { padding-right: var(--touch); margin-bottom: var(--sp-lg); }
.sheet__merchant { margin: 0; font-size: var(--fs-subtitle); font-weight: 600; }
.sheet__amount { margin: var(--sp-xs) 0; font-size: var(--fs-title); font-weight: 600;
  font-variant-numeric: tabular-nums; }
.sheet__meta { font-size: var(--fs-caption); color: var(--text-muted); }
.section { margin-top: var(--sp-lg); }
.section__title { margin: 0 0 var(--sp-xs); font-size: var(--fs-caption); font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.section p { margin: 0 0 var(--sp-sm); }
.worth { display: flex; gap: var(--sp-md); margin-top: var(--sp-lg); padding: var(--sp-md);
  background: var(--tint-info); border-radius: var(--r-md); }
.worth > .icon { color: var(--info-text); }
.worth__title { margin: 0 0 2px; font-size: var(--fs-small); font-weight: 600; color: var(--info-text); }
.worth p { margin: 0; }
.wit { margin: var(--sp-lg) 0 0; font-size: var(--fs-wit); font-style: italic; color: var(--text-secondary); }

/* ---- Tone block -------------------------------------------------------------- */
.tone { display: flex; gap: var(--sp-md); margin-bottom: var(--sp-lg); padding: var(--sp-md);
  border-radius: var(--r-md); }
.tone__content { flex: 1; min-width: 0; }
.tone__title { margin: 0 0 var(--sp-xs); font-weight: 600; }
.tone__body { margin: 0; }
.tone--attention { background: var(--tint-attention); }
.tone--attention > .icon, .tone--attention .tone__title { color: var(--warning-text); }
.tone--action { background: var(--tint-action); border: 2px solid var(--grapefruit); }
.tone--action > .icon { color: var(--grapefruit); }
.tone--action .tone__title { color: var(--urgent-text); }
.tone__actions { display: flex; flex-wrap: wrap; gap: var(--sp-sm); margin-top: var(--sp-md); }
.tone__actions .btn { flex: 1 1 140px; }
.tone__done { margin: var(--sp-md) 0 0; font-weight: 600; }

/* ---- Buttons ----------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm);
  min-height: 48px; padding: 0 var(--sp-lg); border: 1px solid transparent; border-radius: var(--r-md);
  font: inherit; font-weight: 600; cursor: pointer; }
.btn--primary { background: var(--yellow); color: var(--text); }
.btn--primary:active { background: var(--yellow-dark); }
.btn--secondary { background: var(--surface); color: var(--petrol); border-color: var(--petrol); }
.btn--secondary:active { background: var(--surface-subtle); }
.btn--ghost { min-height: var(--touch); padding: 0 var(--sp-sm); background: none; color: var(--petrol); }
.btn:disabled { background: var(--surface-subtle); border-color: var(--border); color: var(--text-disabled); cursor: default; }

/* ---- Question chips ------------------------------------------------------------ */
.chips { display: flex; flex-wrap: wrap; gap: var(--sp-sm); margin-top: var(--sp-xl); }
.chip { min-height: var(--touch); padding: var(--sp-sm) var(--sp-md); border: 1px solid var(--petrol);
  border-radius: var(--r-pill); background: var(--surface); color: var(--petrol); font: inherit;
  font-size: var(--fs-small); font-weight: 500; text-align: left; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--petrol); color: var(--text-inverse); }
.reply { margin: var(--sp-sm) 0 var(--sp-md); padding: var(--sp-md); background: var(--surface-subtle);
  border-radius: var(--r-md); }
.reply__q { margin: 0 0 var(--sp-xs); font-weight: 600; }
.reply p { margin: 0; }
.reply--loading { color: var(--text-muted); }
.ask { margin-top: var(--sp-lg); }
.ask__label { display: block; margin-bottom: var(--sp-xs); font-size: var(--fs-small); color: var(--text-secondary); }
.ask__row { display: flex; gap: var(--sp-sm); }
.ask__input { flex: 1; min-width: 0; min-height: var(--touch); padding: 0 var(--sp-md);
  border: 1px solid var(--border-strong); border-radius: var(--r-md); font: inherit; color: var(--text); }
.ask__send { width: var(--touch); height: var(--touch); display: grid; place-items: center; border: 0;
  border-radius: var(--r-md); background: var(--petrol); color: var(--text-inverse); cursor: pointer; }

/* ---- Time jump ------------------------------------------------------------------ */
.jump { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; gap: var(--sp-sm);
  padding: var(--sp-xl); text-align: center; background: var(--petrol); color: var(--text-inverse);
  opacity: 0; pointer-events: none; transition: opacity var(--t-slow) var(--ease); }
.jump.is-on { opacity: 1; pointer-events: auto; }
.jump__date { margin: 0; font-size: var(--fs-display); font-weight: 700; line-height: 1.1; }
.jump__sub { margin: 0; font-size: var(--fs-subtitle); }


/* ---- klar prototype: layout pieces built from the tokens only ---- */
.lang { display: flex; gap: var(--sp-xs); }
.lang .chip { min-height: var(--touch); min-width: var(--touch); padding: 0 var(--sp-md); text-align: center; }
.summary { padding: var(--sp-lg) var(--sp-lg) var(--sp-xl); border-bottom: 1px solid var(--border); }
.summary__hello { margin: 0; font-size: var(--fs-small); color: var(--text-secondary); }
.summary__balance { margin: var(--sp-xs) 0; font-size: var(--fs-display); font-weight: 700; line-height: 1.1; }
.summary__sub { margin: 0; font-size: var(--fs-caption); color: var(--text-muted); }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; min-height: var(--touch); padding: var(--sp-md) var(--sp-xs); background: none; border: 0;
  border-bottom: 2px solid transparent; font: inherit; font-size: var(--fs-small); font-weight: 600;
  color: var(--text-secondary); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--petrol); border-bottom-color: var(--petrol); }
.panel { padding: var(--sp-lg); }
.hint { margin: 0 0 var(--sp-sm); font-size: var(--fs-small); color: var(--text-secondary); }
.statement--flush { margin: 0 calc(-1 * var(--sp-lg)); }
.line__new { display: block; font-size: var(--fs-caption); font-weight: 600; color: var(--warning-text); }
.line-explain { display: none; margin: 0 var(--sp-lg) var(--sp-md); }
.is-open > .line-explain { display: block; }
.card { margin-bottom: var(--sp-lg); padding: var(--sp-md); border: 1px solid var(--border); border-radius: var(--r-md);
  display: flex; gap: var(--sp-md); }
.card > .icon { color: var(--petrol); }
.card--plain { background: var(--surface-subtle); border-color: var(--surface-subtle); }
.card__title { margin: 0 0 var(--sp-xs); font-weight: 600; }
.tone p, .worth p, .card p { margin: 0 0 var(--sp-sm); }
.field { display: block; margin-top: var(--sp-md); font-size: var(--fs-small); color: var(--text-secondary); }
input[type=range] { width: 100%; min-height: var(--touch); accent-color: var(--petrol); }
.result { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-sm); margin: var(--sp-sm) 0 var(--sp-md); }
.result__amount { font-size: var(--fs-title); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.result .amount { white-space: nowrap; }
.btn--block { width: 100%; }
.reveal { margin-top: var(--sp-sm); }
.done { margin: var(--sp-sm) 0 0; font-size: var(--fs-small); font-weight: 600; color: var(--success-text); }
.tabs { overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; padding: var(--sp-md); }
.stats { display: flex; gap: var(--sp-sm); margin-bottom: var(--sp-lg); }
.stat { flex: 1; padding: var(--sp-md); border: 1px solid var(--border); border-radius: var(--r-md); }
.stat__label { margin: 0; font-size: var(--fs-caption); color: var(--text-muted); }
.stat__value { margin: var(--sp-xs) 0 0; font-size: var(--fs-subtitle); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat__sub { margin: 0; font-size: var(--fs-caption); color: var(--text-secondary); }
.bubbles { display: block; width: 100%; height: auto; margin: var(--sp-sm) 0; }
.bubble { cursor: pointer; outline: none; }
.bubble { transition: opacity var(--t-fast) var(--ease); }
.bubble circle { stroke: var(--surface); stroke-width: 2; }
.bubble.is-dim { opacity: 0.3; }
.bubble.is-sel circle { stroke: var(--text); stroke-width: 3; }
.bubble:focus-visible circle { stroke: var(--petrol); stroke-width: 3; }
.bubble text { font-family: var(--font); pointer-events: none; text-anchor: middle; }
.legend { display: flex; flex-wrap: wrap; gap: var(--sp-lg); margin: 0 0 var(--sp-md); padding: 0; list-style: none; font-size: var(--fs-small); color: var(--text-secondary); }
.legend li { display: flex; align-items: center; gap: var(--sp-sm); }
.swatch { width: 12px; height: 12px; border-radius: var(--r-pill); flex: none; }
.sw-need { background: var(--petrol); } .sw-cut { background: var(--grapefruit); }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: flex; align-items: center; gap: var(--sp-md); min-height: var(--touch); border-bottom: 1px solid var(--border); font-size: var(--fs-small); }
.rank__name { flex: 1; min-width: 0; }
.rank__share { color: var(--text-muted); font-variant-numeric: tabular-nums; width: 3.5em; text-align: right; }
.app-footer { padding: var(--sp-md) var(--sp-lg) var(--sp-xl); border-top: 1px solid var(--border);
  font-size: var(--fs-caption); color: var(--text-muted); text-align: center; }

</style>
</head>

let lang="en", tab="tx", taxAmt=2400, months=4, savedPot=false;
const GOALS={house:40000,car:15000,holiday:3000,other:5000};
let goalKey="car", goalAmt=GOALS.car, goalSaved=1200, goalMonths=24, plan=new Set(), goalStarted=false;
let dashSel=null, dashOnlyCut=false;
function dashPick(k){dashSel=(dashSel===k?null:k);render();}
function drawBubbles(t){
  const svgEl=document.getElementById("bubbles"); if(!svgEl||!window.d3) return;
  const W=Math.max(280,svgEl.parentElement.clientWidth);
  const data=t.cats.filter(c=>!dashOnlyCut||c.g==="cut");
  const root=d3.hierarchy({children:data}).sum(d=>d.v);
  const H=dashOnlyCut?Math.round(W*0.75):W;
  d3.pack().size([W,H]).padding(3)(root);
  const svg=d3.select(svgEl).attr("viewBox",`0 0 ${W} ${H}`);
  const total=t.cats.reduce((a,c)=>a+c.v,0);
  const g=svg.selectAll("g").data(root.leaves()).join("g")
    .attr("class",d=>"bubble"+(dashSel&&dashSel!==d.data.k?" is-dim":"")+(dashSel===d.data.k?" is-sel":""))
    .attr("transform",d=>`translate(${d.x},${d.y})`)
    .attr("tabindex",0).attr("role","button")
    .attr("aria-label",d=>`${d.data.n}: ${chf(d.data.v,0)}, ${Math.round(d.data.v/total*100)}%, ${d.data.g==="cut"?t.cutG:t.needG}`)
    .on("click",(e,d)=>dashPick(d.data.k))
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();dashPick(d.data.k);}});
  g.append("circle").attr("r",d=>d.r).attr("fill",d=>d.data.g==="cut"?"var(--grapefruit)":"var(--petrol)");
  const ink=d=>d.data.g==="cut"?"var(--text)":"var(--text-inverse)";
  const fits=(d=>d.r>=26&&Math.max(d.data.s.length*(d.r>=55?8:7),56)<=2*d.r-12);
  g.filter(fits).append("text").attr("dy","-0.2em").attr("fill",ink)
    .attr("font-size",d=>d.r>=55?14:12).attr("font-weight",600)
    .text(d=>d.data.s);
  g.filter(fits).append("text").attr("dy","1.1em").attr("fill",ink)
    .attr("font-size",d=>d.r>=55?14:12).style("font-variant-numeric","tabular-nums")
    .text(d=>chf(d.data.v,0));
  g.filter(d=>!fits(d)&&d.r>=14).append("text").attr("dy","0.35em").attr("fill",ink)
    .attr("font-size",12).attr("font-weight",600).text(d=>d.data.v);
}
function pickGoal(k){goalKey=k;goalAmt=GOALS[k];goalStarted=false;render();}
function togglePlan(k){plan.has(k)?plan.delete(k):plan.add(k);render();}
const $=s=>document.querySelector(s);
const chf=(n,dec=2)=>{const p=Math.abs(n).toFixed(dec).split(".");p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,"'");return p.join(".")+" CHF";};
const fmt=n=>(n<0?"\u2212":"+")+chf(n);
const ico=(id,label)=>`<svg class="icon icon--sm" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}><use href="#${id}"/></svg>`;
const big=id=>`<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  const m=$("#main");
  document.getElementById("balance").textContent=chf(8412.35);
  if(tab==="tx"){
    m.innerHTML=`<p class="hint">${t.txHint}</p><ul class="statement statement--flush">`+t.tx.map((x,k)=>`
      <li id="tx${k}">
        <button class="line" aria-expanded="false" onclick="const li=document.getElementById('tx${k}');li.classList.toggle('is-open');this.setAttribute('aria-expanded',li.classList.contains('is-open'))">
          <span class="line__main"><span class="line__merchant">${x.n}</span>${x.flag?`<span class="line__new">${t.flag}</span>`:""}<span class="line__original">${x.raw}</span></span>
          ${x.flag?`<span class="line__flag line__flag--attention">${ico("i-attention",t.flag)}</span>`:""}
          <span class="line__amount ${x.a<0?"":"line__amount--in"}">${fmt(x.a)}</span>
        </button>
        <div class="line-explain reply"><p>${x.e}</p></div>
      </li>`).join("")+`</ul>`;
  } else if(tab==="soon"){
    const per=Math.ceil(taxAmt/months);
    m.innerHTML=`
      <div class="tone tone--attention">${big("i-attention")}<div class="tone__content">
        <p class="tone__title">${t.taxH}</p><p class="tone__body">${t.taxP}</p>
        <label class="field">${t.taxL}: <b class="amount">${chf(taxAmt,0)}</b>
          <input type="range" min="500" max="8000" step="100" value="${taxAmt}" oninput="taxAmt=+this.value;render()"></label>
        <label class="field">${t.monthsL}: <b>${months}</b>
          <input type="range" min="1" max="12" value="${months}" oninput="months=+this.value;render()"></label>
        <div class="result"><span>${t.perMonth}</span><span class="result__amount">${chf(per,0)}</span></div>
        <button class="btn btn--primary btn--block" onclick="savedPot=true;render()">${t.saveBtn}</button>
        <p class="done" role="status">${savedPot?t.saved:""}</p>
      </div></div>
      <div class="worth">${big("i-info")}<div>
        <p class="worth__title">${t.kkH}</p><p>${t.kkP}</p>
        <button class="btn btn--secondary" onclick="this.nextElementSibling.hidden=false;this.remove()">${t.kkBtn}</button>
        <p class="reveal" hidden>${t.kkMore}</p>
      </div></div>
      <div class="card" style="margin-top:var(--sp-lg)">${big("i-bulb")}<div>
        <p class="card__title">${t.prH}</p><p>${t.prP}</p></div></div>`;
  } else if(tab==="dash"){
    const total=t.cats.reduce((a,c)=>a+c.v,0), flex=t.cats.filter(c=>c.g==="cut").reduce((a,c)=>a+c.v,0);
    const sel=t.cats.find(c=>c.k===dashSel);
    const ranked=[...t.cats].sort((a,b)=>b.v-a.v);
    m.innerHTML=`
      <p class="card__title">${t.dashH}</p>
      <p class="hint">${t.dashP}</p>
      <div class="stats">
        <div class="stat"><p class="stat__label">${t.totalL}</p><p class="stat__value">${chf(total,0)}</p></div>
        <div class="stat"><p class="stat__label">${t.flexL}</p><p class="stat__value">${chf(flex,0)}</p><p class="stat__sub">${Math.round(flex/total*100)}% ${t.ofAll}</p></div>
      </div>
      <div class="chips" style="margin-top:0" role="group">
        <button class="chip" aria-pressed="${!dashOnlyCut}" onclick="dashOnlyCut=false;render()">${t.allL}</button>
        <button class="chip" aria-pressed="${dashOnlyCut}" onclick="dashOnlyCut=true;render()">${t.onlyFlexL}</button>
      </div>
      <svg id="bubbles" class="bubbles" role="group" aria-label="${t.dashH}"></svg>
      <ul class="legend"><li><span class="swatch sw-need"></span>${t.needG}</li><li><span class="swatch sw-cut"></span>${t.cutG}</li></ul>
      ${sel?(sel.g==="cut"
        ?`<div class="tone tone--attention" role="status">${big("i-attention")}<div class="tone__content">
            <p class="tone__title">${sel.n} · ${chf(sel.v,0)} ${t.perMo}</p>
            <p>${Math.round(sel.v/total*100)}% ${t.shareL}.</p><p>${sel.tip}</p>
            <button class="btn btn--secondary" onclick="tab='goal';render();scrollTo(0,0)">${t.ideasBtn}</button></div></div>`
        :`<div class="card card--plain" role="status"><div>
            <p class="card__title">${sel.n} · ${chf(sel.v,0)} ${t.perMo}</p>
            <p>${Math.round(sel.v/total*100)}% ${t.shareL}.</p><p>${t.needNote}</p></div></div>`)
        :`<p class="hint" role="status">${t.pickP}</p>`}
      <div class="section">
        <p class="section__title">${t.listH}</p>
        <ul class="rank">${ranked.map(c=>`<li><span class="swatch sw-${c.g}" aria-hidden="true"></span><span class="rank__name">${c.n}<span class="visually-hidden">, ${c.g==="cut"?t.cutG:t.needG}</span></span><span class="amount">${chf(c.v,0)}</span><span class="rank__share">${Math.round(c.v/total*100)}%</span></li>`).join("")}</ul>
      </div>`;
    drawBubbles(t);
  } else if(tab==="goal"){
    const left=Math.max(goalAmt-goalSaved,0), need=Math.ceil(left/goalMonths);
    const found=t.habits.filter(h=>plan.has(h.k)).reduce((a,h)=>a+h.save,0);
    const reach=found?Math.ceil(left/found):0;
    m.innerHTML=`
      <p class="card__title">${t.goalH}</p>
      <div class="chips" style="margin-top:0" role="group" aria-label="${t.goalH}">
        ${Object.keys(GOALS).map(k=>`<button class="chip" aria-pressed="${k===goalKey}" onclick="pickGoal('${k}')">${t.goals[k]}</button>`).join("")}
      </div>
      <label class="field">${t.targetL}: <b class="amount">${chf(goalAmt,0)}</b>
        <input type="range" min="1000" max="80000" step="500" value="${goalAmt}" oninput="goalAmt=+this.value;render()"></label>
      <label class="field">${t.savedL}: <b class="amount">${chf(goalSaved,0)}</b>
        <input type="range" min="0" max="20000" step="100" value="${goalSaved}" oninput="goalSaved=+this.value;render()"></label>
      <label class="field">${t.whenL}: <b>${goalMonths}</b>
        <input type="range" min="3" max="60" value="${goalMonths}" oninput="goalMonths=+this.value;render()"></label>
      <div class="result"><span>${t.needH}</span><span class="result__amount">${chf(need,0)}</span></div>

      <div class="section">
        <p class="section__title">${t.habitsH}</p>
        <p class="hint">${t.habitsP}</p>
        ${t.habits.map(h=>`
          <div class="card">${big("i-bulb")}<div class="tone__content">
            <p class="card__title">${h.n}</p>
            <p class="line__original">${h.d}</p>
            <div class="result" style="margin:var(--sp-sm) 0"><span>${t.nowL}</span><span class="amount">${chf(h.now,0)} ${t.perMo}</span></div>
            <div class="result" style="margin:0 0 var(--sp-sm)"><span>${t.saveL}</span><span class="amount line__amount--in">${chf(h.save,0)} ${t.perMo}</span></div>
            <p>${h.tip}</p>
            ${h.wit?`<p class="wit" style="margin:0 0 var(--sp-sm)">${h.wit}</p>`:""}
            <button class="chip" aria-pressed="${plan.has(h.k)}" onclick="togglePlan('${h.k}')">${plan.has(h.k)?t.addedL:t.addL}</button>
          </div></div>`).join("")}
      </div>

      <div class="worth" role="status">${big("i-jump")}<div class="tone__content">
        <p class="worth__title">${t.planH}</p>
        ${found?`
          <p style="margin:0">${t.planFound}</p><p class="result__amount" style="margin:0 0 var(--sp-sm)">${chf(found,0)} ${t.perMo}</p>
          <p>${t.planReach} <b>${reach} ${t.monthsW}</b>.</p>
          ${found>=need?`<p class="done">${t.planOk}</p>`:`<div class="result" style="margin:0"><span>${t.planShort}</span><span class="amount">${chf(need-found,0)}</span></div>`}
        `:`<p>${t.planNone}</p>`}
      </div></div>
      <button class="btn btn--primary btn--block" style="margin-top:var(--sp-lg)" onclick="goalStarted=true;render()">${t.startBtn}</button>
      <p class="done" role="status">${goalStarted?t.started:""}</p>`;
  } else {
    m.innerHTML=`
      <div class="card card--plain"><div>
        <p class="card__title">${t.ahvH}</p><p>${t.ahvP}</p>
        <button class="btn btn--secondary" onclick="this.nextElementSibling.hidden=false;this.remove()">${t.ahvBtn}</button>
        <p class="reveal" hidden>${t.ahvMore}</p>
      </div></div>
      <div class="tone tone--attention">${big("i-attention")}<div class="tone__content">
        <p class="tone__title">${t.p3H}</p><p class="tone__body">${t.p3P}</p></div></div>
      <div class="worth">${big("i-info")}<div>
        <p class="worth__title">${t.indH}</p><p>${t.indP}</p></div></div>`;
  }
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const act=document.querySelector('nav button[aria-selected="true"]'); if(act) act.scrollIntoView({inline:"nearest",block:"nearest"});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
render();
addEventListener("resize",()=>{if(tab==="dash")render();});
</script>
</body>
</html>
